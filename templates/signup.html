{% extends 'base.html' %}

{% block title %}Sign Up{% endblock %}

{% block content %}
<div class="signup-container cardx">
  <h2>Sign Up</h2>
  <form method="post">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" required><br>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" required><br>

    <label for="confirm_password">Confirm Password</label>
    <input type="password" id="confirm_password" name="confirm_password" required><br>

    <input type="submit" value="Sign Up">
  </form>
  <br>
  <h5><p>Already have an account? <a href="{{ url_for('login') }}">Log in here</a></p></h5>
</div>

<style>

.main-content {
            width: 100%;
            max-width: 800px;
            background: rgba(245, 240, 225, 0);
            border-radius: 20px;
            padding: 0rem;
            backdrop-filter: blur(0px);
            -webkit-backdrop-filter: blur(0px);
            border: 1px solid rgba(214, 176, 132, 0);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0);
            position: relative;
        }

.signup-container {
    max-width: 400px;
    margin: 0 auto;
    padding: 2rem;
    text-align: center;
}

.signup-container h2 {
    margin-bottom: 1rem;
    color: #333;
}

.signup-container input[type="text"],
.signup-container input[type="password"] {
    width: 100%;
    padding: 0.5rem;
    margin: 0.5rem 0 1rem;
    border: 1px solid rgba(139, 69, 19, 0.3);
    border-radius: 4px;
    background: rgba(255, 255, 255, 0.9);
    color: #333;
}

.signup-container input[type="submit"] {
    background: rgba(139, 69, 19, 0.9);
    color: #fff;
    padding: 0.5rem 2rem;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 1rem;
    transition: all 0.3s ease;
}

.signup-container input[type="submit"]:hover {
    background: rgba(101, 67, 33, 1);
    transform: translateY(-2px);
}

.signup-container a {
    color: #8B4513;
    text-decoration: none;
}

.signup-container a:hover {
    text-decoration: underline;
}

.cardx {
    background: rgba(245, 240, 225, 0.85);
    border-radius: 10px;
    padding-right: 6rem;
    padding-left: 6rem;
    padding-top: 2rem;
    padding-bottom: 2rem;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    width: 100%;
    max-width: 600px;
    align-items: center;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(214, 176, 132, 0.5);
    height: auto;
    min-height: 0;
}

form label {
    display: block;
    margin-bottom: 5px;
    font-weight: 600;
    color: #333;
}

h5 {
    color: #333;
}
</style>
{% endblock %}
