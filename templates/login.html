{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<div>
    <div class="login-container cardx">
    <h2>Login</h2>
    <form method="post">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required><br>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required><br>

        <input type="submit" value="Log In">
    </form>
    <br>
    <h5><p>Don't have an account? <a href="{{ url_for('signup') }}">Sign up here</a></p></h5>
    </div>
</div>

<style>
.login-container {
    max-width: 600px;
    margin: 0 auto;
    padding: 1.5rem;
    text-align: center;
}

.login-container input[type="text"],
.login-container input[type="password"] {
    width: 100%;
    padding: 0.5rem;
    margin: 0.3rem 0 0.8rem;
    border: 1px solid rgba(139, 69, 19, 0.3);
    border-radius: 4px;
    background: rgba(255, 255, 255, 0.9);
    color: #333;
}

.login-container h2 {
    margin-bottom: 1rem;
    color: #333;
}

.login-container form {
    margin-bottom: 0.8rem;
}

.login-container input[type="submit"] {
    background: rgba(139, 69, 19, 0.9);
    color: #fff;
    padding: 0.5rem 2rem;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 1rem;
    transition: all 0.3s ease;
    margin-top: 0.5rem;
}

.login-container input[type="submit"]:hover {
    background: rgba(101, 67, 33, 1);
    transform: translateY(-2px);
}

.login-container a {
    color: #8B4513;
    text-decoration: none;
}

.login-container a:hover {
    text-decoration: underline;
}

.cardx {
    background: rgba(245, 240, 225, 0.85);
    border-radius: 20px;
    padding-top: 2rem;
    padding-right: 6rem;
    padding-left: 6rem;
    padding-bottom: 2rem;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    width: 100%;
    max-width: 600px;
    align-items: center;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(214, 176, 132, 0.5);
    height: auto;
    min-height: 0;
}

form label {
    display: block;
    margin-bottom: 5px;
    font-weight: 600;
    color: #333;
}

h5 {
    color: #333;
}

.main-content {
            width: 100%;
            max-width: 800px;
            background: rgba(245, 240, 225, 0);
            border-radius: 20px;
            padding: 0rem;
            backdrop-filter: blur(0px);
            -webkit-backdrop-filter: blur(0px);
            border: 1px solid rgba(214, 176, 132, 0);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0);
            position: relative;
        }
</style>
{% endblock %}
